server {
    listen 80;
    server_name ~^(?<people_user>[a-z][a-z0-9-]{0,30}[a-z0-9])\.p\.meyerbrief\.de$;

    root /home/$people_user/public_html;
    index index.html;

    autoindex off;
    disable_symlinks if_not_owner;

    if (-f /var/lib/people-agent/suspended/$people_user) {
        return 403;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
